<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            margin: 20px;
        }
    </style>
</head>

<body>
    <caption>STUDENT DETAILS</caption>
    <table border="1">
        <tr>
            <th align="center" colspan="4">Students Information</th>
        </tr>
        <tr>
            <th rowspan="3">Students</th>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Sara</td>
            <td>20</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Ali</td>
            <td>21</td>
            <td>B</td>
        </tr>
    </table>



    <table border="1" width="100%" height="600px">
        <caption>PAGE LAYOUT</caption>
        <tr>
            <td align="center" colspan="2">Header</td>
        </tr>
        <tr>
            <td width="20%" align="center">Sidebar</td>
            <td align="center">Main Content</td>
        </tr>
        <tr>
            <td align="center" colspan="2">Footer</td>
        </tr>
    </table>

    <audio src="./Assets/images/sample_audio.mp3" controls autoplay loop> Sample audio</audio>

    <video width="300px" height="300px" src="./Assets/images/Sample_video.mp4" type="video/mp4" controls autoplay loop>
        Sample Video</video>
    <iframe src="https://en.wikipedia.org/wiki/Pakistan" frameborder="0" height="500px" width="600px"
        title="Welcome to our page">Visit Wikipedia</iframe>
    <svg width="200px" height="200px">
        <circle cy="50" cx="50" r="25!" fill="yellow"></circle>
    </svg>
</body>

</html>
