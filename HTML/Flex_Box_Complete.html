        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            padding: 20px;
            gap: 20px;
            margin: 50px;

        } 

        .box {
  width: 100px;
  height: 100px;
  background: aquamarine;
  transition: all 3s ease-in-out 2s;
}
.box:hover {
  width: 200px;
  background: rgb(170, 170, 190);
  height: 200px;
  color: red;
  text-align: center;
}




    </style>
    </head>
    <body>
        <h2>FlexBox Example With All Properties</h2>
        <div class="container">
            <div class="box box1">Box 01</div>
            <div class="box box2">Box 02</div>
            <div class="box box3">Box 03</div>
            <div class="box box4">Box 04</div>
            <div class="box box5">Box 05</div>

        </div>
    </body>
