<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Grid Example</title>
<style>
.grid-container {
display: grid;
grid-template-columns: 1fr 2fr 1fr; /* 3 columns: flexible widths */
gap: 15px; /* spacing between rows and columns */
justify-content: center; /* center grid horizontally */
align-content: center; /* center grid vertically */
height: 100vh;
background-color: #f4f4f4;
padding: 20px;
}
.grid-item {
background-color: steelblue;
color: white;
padding: 20px;
font-size: 24px;
text-align: center;
border-radius: 8px;
}
/* Span item 1 across 2 columns */
.item1 {

grid-column: 1 / 3;
}
/* Span item 4 across 2 rows */
.item4 {
grid-row: 2 / 4;
}
</style>
</head>
<body>
<h1 style="text-align: center;">CSS Grid - Most Important Properties</h1>
<div class="grid-container">
<div class="grid-item item1">Item 1 (col 1-2)</div>
<div class="grid-item">Item 2</div>
<div class="grid-item">Item 3</div>
<div class="grid-item item4">Item 4 (row 2-3)</div>
<div class="grid-item">Item 5</div>
<div class="grid-item">Item 6</div>
</div>
</body>
</html>
