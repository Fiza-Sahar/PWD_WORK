<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Units Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      border: 1px solid #ccc;
      margin: 15px 0;
      padding: 10px;
      background-color: #f9f9f9;
    }

    /* Absolute units */
    .px { width: 100px; height: 50px; }
    .cm { width: 5cm; height: 2cm; }
    .mm { width: 50mm; height: 20mm; }
    .in { width: 2in; height: 1in; }
    .pt { width: 150pt; height: 100pt; }
    .pc { width: 10pc; height: 5pc; }

    /* Relative units */
    .em { font-size: 2em; }
    .rem { font-size: 2rem; }
    .percent { width: 50%; }
    .ex { font-size: 2ex; }
    .ch { width: 20ch; }

    /* Viewport units */
    .vw { width: 50vw; height: 10vh; }
    .vh { height: 20vh; }
    .vmin { width: 10vmin; height: 10vmin; }
    .vmax { width: 10vmax; height: 10vmax; }

    /* Time (animation) */
    .time {
      width: 100px;
      height: 100px;
      background-color: steelblue;
      animation: move 3s ease-in-out infinite;
    }

    @keyframes move {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(100px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <h2>CSS Units Demo</h2>

  <!-- Absolute Units -->
  <div class="box px">100px width</div>
  <div class="box cm">5cm width</div>
  <div class="box mm">50mm width</div>
  <div class="box in">2in width</div>
  <div class="box pt">150pt width</div>
  <div class="box pc">10pc width</div>

  <!-- Relative Units -->
  <div class="box em">2em font-size</div>
  <div class="box rem">2rem font-size</div>
  <div class="box percent">50% width</div>
  <div class="box ex">2ex font-size</div>
  <div class="box ch">20ch width</div>

  <!-- Viewport Units -->
  <div class="box vw">50vw width</div>
  <div class="box vh">20vh height</div>
  <div class="box vmin">10vmin box</div>
  <div class="box vmax">10vmax box</div>

  <!-- Time Units -->
  <h3>Animation with Time Unit (3s)</h3>
  <div class="box time"></div>

</body>
</html>
