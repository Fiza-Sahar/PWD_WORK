  .shadow-box{
    width: 200px;
    height: 200px;
    background-color: aqua;
    box-shadow: 5px 5px 50px  30px inset grey;
  }
.shadow-text{
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-size: 30px;
    color: blueviolet;
    /* text-shadow: 5px 5px 15px red; */
    text-shadow: -5px -5px 0 #fff, 3px 3px 0 #000;

}
.box-with-outline{
    width: 500px;
    height: 300px;
    background-color: aquamarine;
    
}

    </style>
</head>
<body>
